<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ব্যবসা ম্যানেজার</title>
<style>
:root{--bg:#f6f7fb;--cd:#fff;--tx:#1e1b4b;--mu:#6b7280;--ac:#4f35e8;--bd:#e5e7eb;--soft:#eeebff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14122a;--cd:#1f1c3a;--tx:#ece9ff;--mu:#a5a3c7;--ac:#8b7cf6;--bd:#332f55;--soft:#2a2650;color-scheme:dark}}
:root[data-theme=dark]{--bg:#14122a;--cd:#1f1c3a;--tx:#ece9ff;--mu:#a5a3c7;--ac:#8b7cf6;--bd:#332f55;--soft:#2a2650;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Hind Siliguri","Noto Sans Bengali","Nirmala UI",system-ui,sans-serif}
.app{display:flex;min-height:100vh}
.side{width:244px;background:var(--cd);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex:none;overflow:auto}
.logo{font-size:20px;font-weight:700;color:var(--ac);padding:4px 10px 14px}
.side a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;cursor:pointer;margin:1px 0}
.side a:hover{background:var(--soft)}.side a.on{background:var(--ac);color:#fff}
.sp{flex:1}.sc .side{display:none}
.main{flex:1;min-width:0}
.top{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
.ib{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:9px;width:38px;height:36px;cursor:pointer;font-size:16px}
select,input{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;padding:7px 9px;font:inherit;max-width:100%}
.pg{padding:16px;max-width:1200px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cells{display:grid;grid-template-columns:1fr 1fr}.cell{padding:10px 8px;border:0 solid var(--bd);border-bottom-width:1px}.cell:nth-child(odd){border-right-width:1px}.cell:nth-last-child(-n+2){border-bottom:0}
.cell small{color:var(--mu);display:block}.cell b{font-size:20px;color:var(--ac)}
.blur b{filter:blur(7px)}
.tg button{border:0;background:none;padding:4px 8px;border-radius:7px;cursor:pointer;color:var(--tx)}.tg button.on{background:var(--soft)}
.fr{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.fr label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
button.b,.fr>button{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:8px 14px;font:inherit;cursor:pointer}
button.s{background:var(--soft);color:var(--ac);border:0;border-radius:7px;padding:3px 9px;cursor:pointer;font:inherit;margin:1px}
button.r{color:#dc2626}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px}
.ban{border-radius:14px;padding:26px;color:#fff;background:linear-gradient(120deg,#4f35e8,#7c5cff 60%,#a78bfa);margin-bottom:14px}.ban h2{margin:0 0 6px;font-size:24px}
.bk{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.bk .b{background:#15803d}.mu{color:var(--mu)}
#md{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20}#md.on{display:flex}
#md>div{background:var(--cd);border-radius:14px;padding:16px;width:min(560px,94vw);max-height:90vh;overflow:auto}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.kp button{padding:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;cursor:pointer;font-size:16px}
@media(max-width:800px){.side{position:fixed;z-index:15;left:0;top:0}.g2{grid-template-columns:1fr}.pg{padding:10px}}
@media print{.side,.top,.bk,button{display:none!important}}
</style></head>
<body><div class="app" id="app">
<aside class="side"><div class="logo">▣ ব্যবসা ম্যানেজার</div><div id="nav"></div><div class="sp"></div><div id="nav2"></div></aside>
<div class="main">
<div class="top"><button class="ib" onclick="document.getElementById('app').classList.toggle('sc')">☰</button><div class="sp"></div>
<select id="cs" onchange="swc(this.value)"></select><button class="ib" title="নতুন কোম্পানি" onclick="newCo()">＋</button>
<button class="ib" title="নতুন অর্ডার" onclick="go('ord')">🛒</button><button class="ib" title="ক্যালকুলেটর ও ক্যাশ" onclick="calc()">🧮</button>
<button class="ib" title="থিম" onclick="theme()">🌓</button><button class="ib" title="নোটিফিকেশন" onclick="bell()">🔔</button></div>
<div class="pg" id="main"></div></div></div>
<div id="md" onclick="if(event.target==this)this.classList.remove('on')"><div id="mc"></div></div>
<script>
const $=s=>document.querySelector(s),ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const bn=n=>(+n||0).toLocaleString('bn-BD',{maximumFractionDigits:2}),M=n=>'৳'+bn(n),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const loc=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),T=()=>loc(new Date()),day=o=>{const d=new Date();d.setDate(d.getDate()+o);return loc(d)},mk=o=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);return loc(d).slice(0,7)};
const tot=x=>x.q*x.p,prof=x=>(x.p-x.c)*x.q,sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const mkD=()=>({s:[],p:[],e:[],pay:[],dm:[],pr:[],iv:[],sv:[],lg:[],n:1,u:[{n:'পিস',f:1},{n:'ডজন',f:12},{n:'কার্টন',f:24}]});
let COS=JSON.parse(ls.g('zco')||'null')||{c1:'ডেমো ট্রেডার্স'},CUR=ls.g('zcur');if(!COS[CUR])CUR=Object.keys(COS)[0];
let D=Object.assign(mkD(),JSON.parse(ls.g('zd_'+CUR)||'{}')),P='dash',V={s:'t',p:'t',eye:1};
const save=()=>{ls.s('zd_'+CUR,JSON.stringify(D));ls.s('zco',JSON.stringify(COS));ls.s('zcur',CUR)};
const v=id=>$('#'+id).value,fld=(id,l,t='text')=>`<label>${l}<input id="${id}" type="${t}" ${t=='number'?'step="any"':''}></label>`,sel=(id,l,o,ex='')=>`<label>${l}<select id="${id}" ${ex}>${o.map(([a,b])=>`<option value="${e(a)}">${e(b)}</option>`).join('')}</select></label>`;
const card=(h,b,r='')=>`<div class="card"><h3>${h}<span>${r}</span></h3>${b}</div>`,tb=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.length?r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan=${h.length} class=mu>কিছু নেই</td></tr>`}</table></div>`;
const del=(k,i)=>`<button class="s r" onclick="rm('${k}',${i})">মুছুন</button>`;
function rm(k,i){if(!confirm('মুছবেন?'))return;const x=D[k][i];if(k=='s'){const p=D.p.find(a=>a.id==x.pid);if(p)p.stock+=x.q}if(k=='dm'){const p=D.p.find(a=>a.id==x.pid);if(p)p.stock+=x.q}D[k].splice(i,1);save();go(P)}
const lg=(i,f,o,n)=>{D.lg.unshift({d:new Date().toLocaleString('bn-BD'),i,f,o,n});D.lg=D.lg.slice(0,200)};
const NAV=[['dash','▦','ড্যাশবোর্ড'],['day','📅','দৈনিক সামারী'],['led','📒','সংরক্ষিত খাতা'],['mon','📊','মাসিক বিক্রি'],['emp','👥','কর্মচারীবৃন্দ'],['due','🧾','বকেয়া হিসাব'],['prod','📦','পণ্য তালিকা'],['ord','📝','পেমেন্ট ও অর্ডার'],['dmg','⚠️','ক্ষতিগ্রস্ত পণ্য'],['prz','🎁','পুরস্কার তালিকা'],['biz','💲','ব্যবসা ও বিনিয়োগ']],NAV2=[['set','🏪','ব্যবসা সেটআপ'],['terms','🛡','শর্তাবলী'],['help','🎧','হেল্পলাইন ও সাপোর্ট']];
function go(p){P=p;const f=([k,i,t])=>`<a class="${k==p?'on':''}" onclick="go('${k}');if(innerWidth<800)$('#app').classList.add('sc')">${i} ${t}</a>`;$('#nav').innerHTML=NAV.map(f).join('');$('#nav2').innerHTML=NAV2.map(f).join('');$('#cs').innerHTML=Object.entries(COS).map(([k,n])=>`<option value="${k}" ${k==CUR?'selected':''}>${e(n)}</option>`).join('');$('#main').innerHTML=PG[p]();scrollTo(0,0)}
function swc(k){CUR=k;D=Object.assign(mkD(),JSON.parse(ls.g('zd_'+k)||'{}'));save();go('dash')}
function newCo(){const n=prompt('নতুন কোম্পানির নাম:');if(n){const k='c'+Date.now();COS[k]=n;CUR=k;D=mkD();save();go('dash')}}
function theme(){const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
function bell(){const l=D.p.filter(x=>x.stock<=5);alert(l.length?'কম স্টক:\n'+l.map(x=>x.name+' — '+bn(x.stock)).join('\n'):'কোনো নোটিফিকেশন নেই')}
const tgl=(k,m)=>`<span class="tg">${[['t','▦'],['q','📦']].map(([a,b])=>`<button class="${V[k]==a?'on':''}" onclick="V.${k}='${a}';go('dash')">${b}</button>`).join('')}${k=='p'?`<button onclick="V.eye=!V.eye;go('dash')">👁</button>`:''}</span>`;
function cells(k,f){const t=T(),y=day(-1),m=T().slice(0,7),l=mk(-1);return [['আজকের',x=>x.d==t],['গতকালের',x=>x.d==y],['চলতি মাসের',x=>x.d.startsWith(m)],['গত মাসের',x=>x.d.startsWith(l)]].map(([n,c])=>{const a=D.s.filter(c);return `<div class="cell"><small>${n}</small><b>${V[k]=='t'?M(sum(a,f)):bn(sum(a,x=>x.q))+' পিস'}</b></div>`}).join('')}
const PG={
dash:()=>`<div class="bk"><button class="b" onclick="backup()">⟳ ব্যাকআপ</button><span class="mu">নিয়মিত ব্যাকআপ নিন — ডেটা শুধু এই ব্রাউজারে থাকে</span></div><div class="g2"><div class="card"><h3>বিক্রয় ${tgl('s')}</h3><div class="cells">${cells('s',tot)}</div></div><div class="card"><h3>লাভ ${tgl('p')}</h3><div class="cells ${V.eye?'blur':''}">${cells('p',prof)}</div></div></div><div class="ban"><h2>আপনার ব্যবসার হিসাব, এক জায়গায়</h2>স্টক • বাকি • কর্মচারী • লাভ-ক্ষতি — সব অটোমেটিক</div><div class="g2">${card('মোট বাকি',`<b style="font-size:22px;color:var(--ac)">${M(sum(D.s,x=>tot(x)-x.paid))}</b>`)}${card('স্টকের মূল্য (ক্রয়)',`<b style="font-size:22px;color:var(--ac)">${M(sum(D.p,x=>x.buy*x.stock))}</b>`)}</div>`,
day:()=>{V.dd=V.dd||T();const a=D.s.filter(x=>x.d==V.dd),dm=sum(D.dm.filter(x=>x.d==V.dd),x=>x.l),py=sum(D.pay.filter(x=>x.d==V.dd),x=>x.a),ex=sum(D.iv.filter(x=>x.d==V.dd&&x.t=='exp'),x=>x.a);return card('দৈনিক সামারী',`<div class="fr"><label>তারিখ<input type="date" id="dd" value="${V.dd}" onchange="V.dd=this.value;go('day')"></label></div>`)+`<div class="card"><div class="cells">${[['বিক্রি',M(sum(a,tot))],['লাভ',M(sum(a,prof))],['আদায় (জমা)',M(sum(a,x=>x.paid))],['বাকি',M(sum(a,x=>tot(x)-x.paid))],['ক্ষতি',M(dm)],['কর্মচারী/অন্যান্য খরচ',M(py+ex)]].map(([n,b])=>`<div class="cell"><small>${n}</small><b>${b}</b></div>`).join('')}</div></div>`+card('বিক্রয়ের তালিকা',tb(['পণ্য','পরিমাণ','মোট','জমা','ক্রেতা'],a.map(x=>[e(x.n),bn(x.q),M(tot(x)),M(x.paid),e(x.cu)])))},
led:()=>card('খাতায় লিখুন',`<div class="fr">${fld('lt','বিবরণ')}${fld('la','টাকা (ঐচ্ছিক)','number')}${fld('ln','নোট')}<button onclick="D.sv.unshift({d:T(),t:v('lt'),a:+v('la')||0,n:v('ln')});save();go('led')">সংরক্ষণ</button></div>`)+card('সংরক্ষিত খাতা',tb(['তারিখ','বিবরণ','টাকা','নোট',''],D.sv.map((x,i)=>[x.d,e(x.t),M(x.a),e(x.n),del('sv',i)]))),
mon:()=>{const m={};D.s.forEach(x=>{const k=x.d.slice(0,7);m[k]=m[k]||[];m[k].push(x)});return card('মাসিক বিক্রি',tb(['মাস','বিক্রয়','পরিমাণ','লাভ','জমা','বাকি'],Object.keys(m).sort().reverse().map(k=>[k,M(sum(m[k],tot)),bn(sum(m[k],x=>x.q)),M(sum(m[k],prof)),M(sum(m[k],x=>x.paid)),M(sum(m[k],x=>tot(x)-x.paid))])),'<button class="s" onclick="print()">🖨 প্রিন্ট</button>')},
emp:()=>{V.fe=V.fe||'';const L=D.pay.map((x,i)=>[x,i]).filter(([x])=>!V.fe||x.e==V.fe);return card('কর্মচারী যোগ করুন',`<div class="fr">${fld('en','নাম')}${sel('er','পদ',[['SR','SR'],['DSR','DSR'],['Staff','কর্মচারী']])}${fld('ep','মোবাইল')}${fld('es','মাসিক বেতন','number')}${fld('ec','কমিশন %','number')}<button onclick="D.e.push({id:D.n++,name:v('en'),r:v('er'),ph:v('ep'),sal:+v('es')||0,rt:+v('ec')||0});save();go('emp')">যোগ করুন</button></div>`)+card('কর্মচারী তালিকা',tb(['নাম','পদ','মোবাইল','বেতন','কমিশন%','মোট বিক্রি','কমিশন',''],D.e.map((x,i)=>{const t=sum(D.s.filter(s=>s.e==x.id),tot);return[e(x.name),x.r,e(x.ph),M(x.sal),bn(x.rt),M(t),M(t*x.rt/100),del('e',i)]})))+card('বেতন ও কর্মচারী লেজার',`<div class="fr">${sel('pe','কর্মচারী',D.e.map(x=>[x.id,x.name]))}${sel('pt','ধরন',['বেতন','অগ্রিম','কমিশন','ওভারটাইম'].map(x=>[x,x]))}${fld('pa','টাকা','number')}${fld('pn','নোট')}<button onclick="addPay()">যোগ করুন</button><button onclick="payAll()">সবাইকে বেতন দিন</button></div><div class="fr" style="margin:10px 0">${sel('fe','দেখুন',[['','সবাই'],...D.e.map(x=>[x.id,x.name])],'onchange="V.fe=this.value;go(\'emp\')"')}</div>`+tb(['তারিখ','কর্মচারী','ধরন','টাকা','নোট',''],L.map(([x,i])=>[x.d,e((D.e.find(a=>a.id==x.e)||{}).name),x.t,M(x.a),e(x.nt),del('pay',i)])),'মোট: '+M(sum(L,([x])=>x.a)))},
due:()=>{const m={};D.s.forEach(x=>{const k=x.cu||'(নাম নেই)';m[k]=(m[k]||0)+tot(x)-x.paid});window.DK=Object.keys(m).filter(k=>m[k]>.005);return card('বকেয়া হিসাব',tb(['ক্রেতা','বাকি',''],DK.map((k,i)=>[e(k),M(m[k]),`<button class="s" onclick="recv(${i})">জমা নিন</button>`])),'মোট: '+M(sum(DK,k=>m[k])))},
prod:()=>card('পণ্য যোগ করুন',`<div class="fr">${fld('pn','নাম')}${sel('pu','একক',D.u.map(u=>[u.n,u.n]))}${fld('pb','ক্রয়মূল্য','number')}${fld('ps','বিক্রয়মূল্য','number')}${fld('pk','শুরুর স্টক','number')}<button onclick="addP()">যোগ করুন</button></div>`)+card('পণ্য তালিকা',tb(['নাম','একক','ক্রয়','বিক্রয়','স্টক','মূল্য',''],D.p.map((x,i)=>[e(x.name),e(x.u),M(x.buy),M(x.sell),bn(x.stock),M(x.buy*x.stock),`<button class="s" onclick="stk(${i})">+স্টক</button><button class="s" onclick="prc(${i})">দাম</button>`+del('p',i)])))+card('স্টক ও প্রাইস লগ',tb(['সময়','আইটেম','কী','আগে','পরে'],D.lg.slice(0,30).map(x=>[x.d,e(x.i),x.f,bn(x.o),bn(x.n)]))),
ord:()=>card('নতুন অর্ডার / বিক্রয়',`<div class="fr">${sel('op','পণ্য',[['','— বাছাই —'],...D.p.map(x=>[x.id,x.name])],'onchange="fp()"')}${sel('ou','একক',D.u.map(u=>[u.n,u.n]),'onchange="fp()"')}${fld('oq','পরিমাণ','number')}${fld('opr','দাম/একক','number')}${fld('ocu','ক্রেতা')}${sel('oe','SR/DSR',[['','—'],...D.e.filter(x=>x.r!='Staff').map(x=>[x.id,x.name])])}${fld('opd','জমা (খালি = পুরো)','number')}<button onclick="sell()">বিক্রি করুন</button></div>`)+card('পেমেন্ট ও অর্ডারের তালিকা',tb(['তারিখ','পণ্য','পরিমাণ','মোট','জমা','বাকি','ক্রেতা','SR',''],D.s.slice(0,300).map((x,i)=>[x.d,e(x.n),bn(x.q),M(tot(x)),M(x.paid),M(tot(x)-x.paid),e(x.cu),e((D.e.find(a=>a.id==x.e)||{}).name),(tot(x)-x.paid>.005?`<button class="s" onclick="pay1(${i})">জমা</button>`:'')+del('s',i)]))),
dmg:()=>card('ক্ষতিগ্রস্ত পণ্য যোগ',`<div class="fr">${sel('dp','পণ্য',D.p.map(x=>[x.id,x.name]))}${fld('dq','পরিমাণ','number')}${fld('dn','কারণ')}<button onclick="addD()">যোগ করুন</button></div>`)+card('ক্ষতিগ্রস্ত পণ্যের তালিকা',tb(['তারিখ','পণ্য','পরিমাণ','ক্ষতি','কারণ',''],D.dm.map((x,i)=>[x.d,e(x.n),bn(x.q),M(x.l),e(x.nt),del('dm',i)])),'মোট: '+M(sum(D.dm,x=>x.l))),
prz:()=>card('পুরস্কার যোগ করুন',`<div class="fr">${fld('zn','পুরস্কারের নাম')}${fld('zs','স্টক','number')}${fld('zc','একক খরচ','number')}<button onclick="D.pr.push({id:D.n++,name:v('zn'),s:+v('zs')||0,c:+v('zc')||0});save();go('prz')">যোগ করুন</button></div>`)+card('পুরস্কার তালিকা',tb(['নাম','স্টক','একক খরচ','মূল্য',''],D.pr.map((x,i)=>[e(x.name),bn(x.s),M(x.c),M(x.s*x.c),`<button class="s" onclick="pz(${i},1)">+স্টক</button><button class="s" onclick="pz(${i},-1)">প্রদান</button>`+del('pr',i)]))),
biz:()=>{const g=sum(D.s,prof),dm=sum(D.dm,x=>x.l),py=sum(D.pay,x=>x.a),ex=sum(D.iv.filter(x=>x.t=='exp'),x=>x.a),iv=sum(D.iv.filter(x=>x.t=='inv'),x=>x.a);return card('লাভ-ক্ষতির হিসাব (সর্বমোট)',`<div class="cells">${[['মোট লাভ',M(g)],['ক্ষতিগ্রস্ত পণ্য',M(dm)],['কর্মচারী খরচ',M(py)],['অন্যান্য খরচ',M(ex)],['নিট লাভ / (ক্ষতি)',M(g-dm-py-ex)],['মোট বিনিয়োগ',M(iv)]].map(([n,b])=>`<div class="cell"><small>${n}</small><b>${b}</b></div>`).join('')}</div>`)+card('বিনিয়োগ / খরচ যোগ',`<div class="fr">${sel('it','ধরন',[['inv','বিনিয়োগ'],['exp','খরচ']])}${fld('in','বিবরণ')}${fld('ia','টাকা','number')}<button onclick="D.iv.unshift({d:T(),t:v('it'),n:v('in'),a:+v('ia')||0});save();go('biz')">যোগ করুন</button></div>`)+card('তালিকা',tb(['তারিখ','ধরন','বিবরণ','টাকা',''],D.iv.map((x,i)=>[x.d,x.t=='inv'?'বিনিয়োগ':'খরচ',e(x.n),M(x.a),del('iv',i)])))},
set:()=>card('ব্যবসা সেটআপ',`<div class="fr">${fld('cn','কোম্পানির নাম')}<button onclick="COS[CUR]=v('cn');save();go('set')">নাম বদলান</button></div>`.replace('id="cn"',`id="cn" value="${e(COS[CUR])}"`))+card('কাস্টম একক সেটআপ',`<div class="fr">${fld('un','একক নাম')}${fld('uf','১ একক = কত বেস পিস','number')}<button onclick="if(v('un')&&+v('uf')>0){D.u.push({n:v('un'),f:+v('uf')});save();go('set')}">যোগ করুন</button></div>`+tb(['একক','ফ্যাক্টর',''],D.u.map((x,i)=>[e(x.n),bn(x.f),del('u',i)])))+card('ব্যাকআপ, অনলাইন ও থিম',`<div class="fr"><button onclick="backup()">ব্যাকআপ ডাউনলোড</button><label>রিস্টোর<input type="file" accept=".json" onchange="restore(this)"></label><button onclick="online()">কোম্পানিকে অনলাইন করুন (ওয়েবপেজ)</button><button onclick="theme()">থিম পরিবর্তন</button></div>`),
terms:()=>card('শর্তাবলী','<p>এই সফটওয়্যারের সব ডেটা আপনার ব্রাউজারে সংরক্ষিত থাকে। ব্রাউজারের ডেটা মুছলে তথ্য হারিয়ে যেতে পারে, তাই নিয়মিত ব্যাকআপ নিন।</p><p>হিসাবের চূড়ান্ত দায়িত্ব ব্যবহারকারীর; গুরুত্বপূর্ণ সিদ্ধান্তের আগে নিজে মিলিয়ে নিন।</p>'),
help:()=>card('হেল্পলাইন ও সাপোর্ট','<p>ব্যবহারে সমস্যা হলে যিনি এই সফটওয়্যার বানিয়ে দিয়েছেন তাঁর সাথে যোগাযোগ করুন। এখানে নিজের সাপোর্ট নাম্বার বা লিংক বসিয়ে নিতে পারেন।</p>')};
function addP(){if(!v('pn').trim())return alert('নাম দিন');const x={id:D.n++,name:v('pn').trim(),u:v('pu'),buy:+v('pb')||0,sell:+v('ps')||0,stock:+v('pk')||0};D.p.push(x);lg(x.name,'স্টক',0,x.stock);lg(x.name,'ক্রয়',0,x.buy);lg(x.name,'বিক্রয়',0,x.sell);save();go('prod')}
function stk(i){const q=+prompt('কত স্টক যোগ করবেন?');if(q){const p=D.p[i];lg(p.name,'স্টক',p.stock,p.stock+q);p.stock+=q;save();go('prod')}}
function prc(i){const p=D.p[i],b=prompt('নতুন ক্রয়মূল্য',p.buy),s=prompt('নতুন বিক্রয়মূল্য',p.sell);if(b!==null&&s!==null){if(+b!=p.buy)lg(p.name,'ক্রয়',p.buy,+b);if(+s!=p.sell)lg(p.name,'বিক্রয়',p.sell,+s);p.buy=+b;p.sell=+s;save();go('prod')}}
function fp(){const p=D.p.find(x=>x.id==v('op')),f=(D.u.find(x=>x.n==v('ou'))||{f:1}).f;if(p)$('#opr').value=p.sell*f}
function sell(){const p=D.p.find(x=>x.id==v('op')),f=(D.u.find(x=>x.n==v('ou'))||{f:1}).f,q=+v('oq')*f,pr=+v('opr')/f;if(!p||!(q>0)||!(pr>=0)||v('opr')==='')return alert('পণ্য, পরিমাণ ও দাম দিন');if(p.stock<q)return alert('স্টকে আছে '+bn(p.stock));const t=q*pr,pd=v('opd')===''?t:+v('opd');lg(p.name,'স্টক',p.stock,p.stock-q);p.stock-=q;D.s.unshift({id:D.n++,d:T(),pid:p.id,n:p.name,q,p:pr,c:p.buy,paid:pd,cu:v('ocu').trim(),e:v('oe')});save();go('ord')}
function pay1(i){const x=D.s[i],a=+prompt('কত টাকা জমা নিলেন? (বাকি '+bn(tot(x)-x.paid)+')');if(a>0){x.paid=Math.min(tot(x),x.paid+a);save();go('ord')}}
function recv(i){const k=DK[i];let a=+prompt('কত টাকা জমা নিলেন?');if(!(a>0))return;for(const x of [...D.s].reverse()){if((x.cu||'(নাম নেই)')!=k)continue;const d=tot(x)-x.paid;if(d<=0)continue;const u=Math.min(d,a);x.paid+=u;a-=u;if(a<=0)break}save();go('due')}
function addPay(){const a=+v('pa');if(!v('pe')||!(a>0))return alert('কর্মচারী ও টাকা দিন');D.pay.unshift({d:T(),e:+v('pe'),t:v('pt'),a,nt:v('pn')});save();go('emp')}
function payAll(){const l=D.e.filter(x=>x.sal>0);if(l.length&&confirm(l.length+' জনকে এ মাসের বেতন দেবেন?')){l.forEach(x=>D.pay.unshift({d:T(),e:x.id,t:'বেতন',a:x.sal,nt:T().slice(0,7)+' মাসের বেতন'}));save();go('emp')}}
function addD(){const p=D.p.find(x=>x.id==v('dp')),q=+v('dq');if(!p||!(q>0))return alert('পণ্য ও পরিমাণ দিন');if(q>p.stock)return alert('স্টকের চেয়ে বেশি');lg(p.name,'স্টক',p.stock,p.stock-q);p.stock-=q;D.dm.unshift({d:T(),pid:p.id,n:p.name,q,l:q*p.buy,nt:v('dn')});save();go('dmg')}
function pz(i,s){const q=+prompt('পরিমাণ?');if(!(q>0))return;const p=D.pr[i];if(p.s+s*q<0)return alert('স্টক কম');lg('🎁 '+p.name,'স্টক',p.s,p.s+s*q);p.s+=s*q;save();go('prz')}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function backup(){dl('backup-'+T()+'.json',JSON.stringify({co:COS[CUR],D}),'application/json')}
function restore(el){const f=el.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(confirm('বর্তমান ডেটা বদলে যাবে। চালিয়ে যাবেন?')){D=Object.assign(mkD(),o.D);save();go('dash')}}catch(x){alert('ফাইলটি সঠিক নয়')}})}
function online(){const r=D.p.map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.u)}</td><td>${bn(x.sell)}</td><td>${x.stock>0?'আছে':'নেই'}</td></tr>`).join('');dl('index.html',`<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>${e(COS[CUR])}</title><body style="font-family:sans-serif;max-width:760px;margin:24px auto;padding:0 14px"><h1 style="color:#4f35e8">${e(COS[CUR])}</h1><table border=1 cellpadding=8 style="border-collapse:collapse;width:100%"><tr><th>পণ্য<th>একক<th>দাম (৳)<th>স্টক</tr>${r}</table>`,'text/html');alert('index.html ডাউনলোড হয়েছে — এটি যেকোনো হোস্টিংয়ে আপলোড করলেই অনলাইন হবে।')}
function calc(){$('#mc').innerHTML=`<h3 style="margin-top:0">ক্যালকুলেটর</h3><input id="cd" style="width:100%;font-size:20px;text-align:right"><div class="kp">${['7','8','9','÷','4','5','6','×','1','2','3','-','0','.','C','+','(',')','⌫','='].map(k=>`<button onclick="ck('${k}')">${k}</button>`).join('')}</div><h3>ক্যাশ ক্যালকুলেটর</h3><div class="fr">${[1000,500,200,100,50,20,10,5,2,1].map(d=>`<label>৳${bn(d)} ×<input type="number" class="cn" data-d="${d}" style="width:70px" oninput="cash()"></label>`).join('')}</div><h3 id="ct">মোট: ৳০</h3>`;$('#md').classList.add('on')}
function ck(k){const d=$('#cd');if(k=='C')d.value='';else if(k=='⌫')d.value=d.value.slice(0,-1);else if(k=='='){const s=d.value.replace(/×/g,'*').replace(/÷/g,'/');try{if(!/^[\d+\-*\/().\s]+$/.test(s))throw 0;d.value=+Function('return '+s)().toFixed(8)}catch(x){d.value='ভুল'}}else d.value+=k}
function cash(){$('#ct').textContent='মোট: '+M([...document.querySelectorAll('.cn')].reduce((s,i)=>s+i.dataset.d*(+i.value||0),0))}
if(innerWidth<800)$('#app').classList.add('sc');go('dash');
</script></body></html>
